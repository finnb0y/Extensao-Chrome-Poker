<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poker Registro Extractor</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        width: 360px;
        margin: 0;
        padding: 12px;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        border: 1px solid #ccc;
        background: #fff;
        border-radius: 6px;
        padding: 8px 10px;
        cursor: pointer;
      }
      #status {
        font-size: 12px;
        color: #444;
        margin: 8px 0;
        min-height: 16px;
      }
      #result {
        max-height: 320px;
        overflow: auto;
        border: 1px solid #eee;
        border-radius: 6px;
        padding: 8px;
      }
      .table-title {
        font-size: 12px;
        font-weight: 700;
        margin: 0 0 6px;
      }
      .table-divider {
        height: 1px;
        background: #ddd;
        margin: 10px 0;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 11px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 4px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #f6f6f6;
        position: sticky;
        top: 0;
      }
      label {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <button id="collect">Coletar neste site</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="filterOpen" checked /> Registros Abertos</label>
      <label><input type="checkbox" id="filterClosed" checked /> Registros Fechados</label>
    </div>
    <div id="status"></div>
    <div id="result"></div>
    <script src="popup.js"></script>
  </body>
</html>
